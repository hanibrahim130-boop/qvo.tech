    <!--
      Bricolage Grotesque and Fraunces, both OFL, are installed at exactly
      5.3.0 and imported in src/index.css. Vite fingerprints these package
      files and rewrites the preload URLs to the same bundled assets used by
      the generated CSS, so no third-party origin sits on the render path.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-italic.woff2"
    />
