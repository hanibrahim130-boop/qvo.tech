name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vite 8 requires ^20.19.0 || >=22.12.0. Node 18 cannot run this
        # build, so testing it only produces a permanent red cross.
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use npm 10
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Build package
        run: npm run build -w scroll-scrub-video
